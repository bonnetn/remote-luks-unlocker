name: Binary release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, for example v0.1.3
        required: true
        type: string

permissions: {}

concurrency:
  group: binary-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-26.04
            apt-package: gcc
            linker: gcc
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-26.04-arm
            apt-package: gcc
            linker: gcc
          - target: aarch64-apple-darwin
            os: macos-15
            apt-package: ""
            linker: clang
          - target: x86_64-pc-windows-msvc
            os: windows-2025
            apt-package: ""
            linker: ""

    steps:
      - name: Check out release source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install cross compiler
        if: matrix.apt-package != ''
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends --yes "${{ matrix.apt-package }}"

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --no-self-update
          rustup target add "${{ matrix.target }}" --toolchain 1.98.1
          rustup default 1.98.1

      - name: Build binary
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          LINKER: ${{ matrix.linker }}
        run: |
          if [ -n "$LINKER" ]; then
            target_env=$(printf '%s' "$TARGET" | tr '[:lower:]-' '[:upper:]_')
            export "CARGO_TARGET_${target_env}_LINKER=$LINKER"
            echo "CARGO_TARGET_${target_env}_LINKER=$LINKER" >>"$GITHUB_ENV"
          fi
          cargo build --locked --release --target "$TARGET"

      - name: Package binary
        shell: pwsh
        env:
          TARGET: ${{ matrix.target }}
        run: |
          $binary = "remote-luks-unlocker"
          if ($env:TARGET -like "*windows*") {
            $binary += ".exe"
          }
          $asset = "remote-luks-unlocker-$env:RELEASE_TAG-$env:TARGET"
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          tar --create --gzip `
            --file "dist/$asset.tar.gz" `
            --directory "target/$env:TARGET/release" `
            $binary
          $hash = (Get-FileHash "dist/$asset.tar.gz" -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $asset.tar.gz" | Set-Content "dist/$asset.tar.gz.sha256"

      - name: Upload binary artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binary-${{ matrix.target }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish GitHub release assets
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download binary artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" \
              --title "$RELEASE_TAG" \
              --generate-notes
          fi

      - name: Upload binaries and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/* --clobber
