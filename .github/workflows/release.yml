name: Release

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  checks:
    name: Run CI checks
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  release:
    needs: checks
    name: Release patch version
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: write
      contents: write

    env:
      CARGO_TERM_COLOR: always

    steps:
      - name: Check out tested commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: main
          fetch-depth: 0

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.98.1 --profile minimal --no-self-update
          rustup default 1.98.1

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@59d3cd564ab73496b608d1cff6ca619b474d1342 # v1.23.0
        with:
          version: 1.23.0

      - name: Install cargo-release
        run: cargo binstall --no-confirm --disable-telemetry cargo-release@0.25.18

      - name: Configure release commit identity
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com

      - name: Check for changes since the latest release
        id: changes
        run: |
          latest_tag=$(git tag --list 'v*' --sort=-version:refname | head -n 1)
          if [ -z "$latest_tag" ] || ! git diff --quiet "$latest_tag..HEAD"; then
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            echo "Changes found since ${latest_tag:-the initial commit}."
          else
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo "No changes found since $latest_tag; skipping release."
          fi

      - name: Release and publish patch version
        if: steps.changes.outputs.changed == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          test -n "$CARGO_REGISTRY_TOKEN"
          cargo release patch --execute --no-confirm

      - name: Start binary and container releases
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_tag=$(git describe --tags --abbrev=0)
          gh workflow run binary-release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            --field "tag=$release_tag"
          gh workflow run container-release.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            --field "tag=$release_tag"
