name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"

    steps:
      # Pin actions to an immutable commit rather than a mutable tag.
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.85.0 \
            --profile minimal \
            --component clippy \
            --component rustfmt \
            --no-self-update
          rustup default 1.85.0
          rustc --version --verbose
          cargo --version --verbose

      - name: Install Podman
        run: |
          if ! command -v podman >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y podman
          fi
          podman --version

      - name: Check Podman
        run: |
          podman info

      - name: Install cargo-deny
        run: |
          archive="$RUNNER_TEMP/cargo-deny.tar.gz"
          url="https://github.com/EmbarkStudios/cargo-deny/releases/download/0.19.0/cargo-deny-0.19.0-x86_64-unknown-linux-musl.tar.gz"
          curl --fail --location --proto '=https' --tlsv1.2 --output "$archive" "$url"
          echo '0e8c2aa59128612c90d9e09c02204e912f29a5b8d9a64671b94608cbe09e064f  '"$archive" | sha256sum --check --status
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          install --mode 0755 \
            "$RUNNER_TEMP/cargo-deny-0.19.0-x86_64-unknown-linux-musl/cargo-deny" \
            "$HOME/.cargo/bin/cargo-deny"
          cargo deny --version

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Check dependencies
        run: cargo deny check

      - name: Validate package
        run: cargo package --locked

      - name: Run tests
        run: cargo test --all-targets --all-features
