name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: "1"

    steps:
      # Pin actions to an immutable commit rather than a mutable tag.
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install 1.98.1 \
            --profile minimal \
            --component clippy \
            --component rustfmt \
            --no-self-update
          rustup default 1.98.1
          rustc --version --verbose
          cargo --version --verbose

      - name: Install Podman
        run: |
          if ! command -v podman >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends -y podman
          fi
          podman --version

      - name: Check Podman
        run: |
          podman info

      - name: Install cargo-binstall
        uses: cargo-bins/cargo-binstall@59d3cd564ab73496b608d1cff6ca619b474d1342 # v1.23.0
        with:
          version: 1.23.0

      - name: Install cargo-deny
        run: cargo binstall --no-confirm --disable-telemetry cargo-deny@0.19.0

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Check dependencies
        run: cargo deny check

      - name: Validate package
        run: cargo package --locked

      - name: Run tests
        run: cargo test --all-targets --all-features
