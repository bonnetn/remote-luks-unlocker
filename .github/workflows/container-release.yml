name: Container release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build, for example v0.1.3
        required: true
        type: string

permissions: {}

concurrency:
  group: container-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.arch }} image
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-26.04
          - arch: arm64
            os: ubuntu-26.04-arm

    steps:
      - name: Check out release source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install Podman
        run: |
          if ! command -v podman >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends --yes podman
          fi
          podman --version

      - name: Log in to GitHub Container Registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | podman login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build and push architecture image
        env:
          IMAGE: ${{ env.IMAGE_NAME }}:${{ env.RELEASE_TAG }}-${{ matrix.arch }}
        run: |
          podman build --file Containerfile --tag "$IMAGE" .
          podman run --rm "$IMAGE" --help
          podman push "$IMAGE"

  publish:
    name: Publish multi-platform image
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      packages: write

    steps:
      - name: Install Podman
        run: |
          if ! command -v podman >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install --no-install-recommends --yes podman
          fi
          podman --version

      - name: Log in to GitHub Container Registry
        env:
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$GH_TOKEN" | podman login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Create and push manifest list
        env:
          IMAGE: ${{ env.IMAGE_NAME }}:${{ env.RELEASE_TAG }}
          LATEST_IMAGE: ${{ env.IMAGE_NAME }}:latest
        run: |
          podman manifest create "$IMAGE" "${IMAGE}-amd64" "${IMAGE}-arm64"
          podman manifest push --all "$IMAGE" "docker://${IMAGE}"
          podman manifest create "$LATEST_IMAGE" "${IMAGE}-amd64" "${IMAGE}-arm64"
          podman manifest push --all "$LATEST_IMAGE" "docker://${LATEST_IMAGE}"
          podman manifest inspect "docker://${LATEST_IMAGE}"
