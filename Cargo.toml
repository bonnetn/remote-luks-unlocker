[package]
name = "remote-luks-unlocker"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Poll an SSH endpoint and run a remote LUKS unlock command."
license = "MIT"
repository = "https://github.com/bonnetn/remote-luks-unlocker"
readme = "README.md"
keywords = ["ssh", "luks", "dropbear", "disk-encryption", "polling"]
categories = ["command-line-utilities", "network-programming"]
include = ["src/**", "Cargo.toml", "Cargo.lock", "README.md", "LICENSE"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "warn"
nursery = "warn"
