[package]
name = "remote-luks-unlocker"
version = "0.1.11"
edition = "2024"
rust-version = "1.85"
description = "Unlock a LUKS-encrypted Linux server remotely over verified SSH."
license = "MIT"
repository = "https://github.com/bonnetn/remote-luks-unlocker"
readme = "README.md"
keywords = ["ssh", "luks", "dropbear", "initramfs", "disk-encryption"]
categories = ["command-line-utilities", "network-programming"]
include = ["src/**", "Cargo.toml", "Cargo.lock", "README.md", "docs/**", "man/**", "LICENSE"]

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
clap_mangen = "0.2"
tokio = { version = "1.53.1", features = ["fs", "io-util", "macros", "net", "process", "rt", "signal", "time"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "warn"
nursery = "warn"
